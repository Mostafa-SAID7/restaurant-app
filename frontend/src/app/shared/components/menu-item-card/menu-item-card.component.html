<article class="flex flex-col h-full overflow-hidden rounded-[2rem] bg-bg-surface border border-border/50 transition-all duration-500 hover:-translate-y-2 hover:shadow-2xl hover:border-accent/40 group relative shadow-lg">
  <!-- Image Container -->
  <div class="relative w-full aspect-[4/3] overflow-hidden bg-bg-surface-2 rounded-[2rem] m-2 shadow-inner">
    @if (item.image) {
      <img [src]="item.image" [alt]="item.name" class="w-full h-full object-cover object-center block transition-transform duration-700 group-hover:scale-110" />
    } @else {
      <div class="w-full h-full flex items-center justify-center bg-gradient-to-br from-bg-surface-2 to-bg-surface-3 text-text-muted/30 text-6xl">
        <app-icon [name]="categoryIcon" strokeWidth="1"></app-icon>
      </div>
    }
    
    <!-- Overlay Tags -->
    <div class="absolute top-4 left-4 right-4 flex justify-between items-start gap-2">
      <span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-black/60 backdrop-blur-md text-white border border-white/10 shadow-lg">{{ item.category }}</span>
      @if (item.tags?.includes('chef-special')) {
        <span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-accent text-white shadow-accent/20 shadow-lg flex items-center gap-1.5">
          <app-icon name="trophy" class="text-[12px]"></app-icon> Chef's Special
        </span>
      }
    </div>

    <!-- Hover Info Overlay -->
    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-500 flex items-center justify-center pointer-events-none rounded-[2rem]">
      <div class="w-12 h-12 rounded-full bg-accent text-white flex items-center justify-center scale-75 group-hover:scale-100 transition-transform duration-500 shadow-xl shadow-accent/20">
        <app-icon name="plus" strokeWidth="2.5"></app-icon>
      </div>
    </div>
  </div>

  <!-- Content -->
  <div class="flex-1 flex flex-col p-6 gap-4">
    <div class="flex justify-between items-start gap-4">
      <h3 class="text-xl font-serif text-text leading-tight group-hover:text-accent transition-colors duration-300">{{ item.name }}</h3>
      <span class="text-lg font-serif font-bold text-accent whitespace-nowrap">${{ item.price }}</span>
    </div>

    <p class="text-sm leading-relaxed text-text-muted/90 flex-1 line-clamp-3">{{ item.description }}</p>

    @if (item.allergens && item.allergens.length > 0) {
      <div class="flex flex-wrap gap-1.5">
        @for (allergen of item.allergens; track allergen) {
          <span class="text-[10px] px-2 py-0.5 rounded-full bg-white/5 text-text-dim border border-white/5">{{ allergen }}</span>
        }
      </div>
    }

    <div class="pt-4 border-t border-border/50">
      <button class="w-full py-3 rounded-lg bg-bg-surface-2 hover:bg-accent text-text hover:text-white transition-all duration-300 text-xs font-bold uppercase tracking-widest border border-white/5 hover:border-accent shadow-sm hover:shadow-accent/20 flex items-center justify-center gap-2 group/btn" 
              (click)="onAddClick()">
        Add to Order
        <app-icon name="arrow_right" class="group-hover/btn:translate-x-1 transition-transform"></app-icon>
      </button>
    </div>
  </div>
</article>
