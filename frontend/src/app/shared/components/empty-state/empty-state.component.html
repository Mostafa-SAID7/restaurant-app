<div class="flex flex-col items-center justify-center gap-4 p-6 text-center min-h-80">
  <div class="flex items-center justify-center w-16 h-16 rounded-full bg-bg-surface-2 text-text-muted">
    <app-icon [name]="icon" class="w-8 h-8 flex items-center justify-center"></app-icon>
  </div>
  <h3 class="text-xl font-semibold text-text m-0">{{ title }}</h3>
  @if (message) {
    <p class="text-sm text-text-muted m-0 max-w-sm">{{ message }}</p>
  }
  @if (showAction) {
    <button class="btn btn-ghost mt-2" (click)="onActionClick()">
      {{ actionLabel }}
    </button>
  }
  <ng-content></ng-content>
</div>
